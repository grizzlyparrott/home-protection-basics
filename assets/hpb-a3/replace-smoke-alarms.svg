<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Replace, then verify coverage</title><desc id="desc">Three-step flow diagram: check the manufacture date and label, replace at end of life or after a failed test, then test the replacement and interconnected coverage.</desc>
<rect width="1200" height="675" fill="#0f1520"/><path d="M0 552 C260 480 432 648 720 550 S1030 458 1200 545 L1200 675 L0 675 Z" fill="#12253a"/>
<rect x="48" y="42" width="250" height="36" rx="18" fill="#17324d"/><text x="173" y="67" fill="#8bc5ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">HOME PROTECTION BASICS</text>
<text x="48" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">Replace, then verify coverage</text><text x="48" y="166" fill="#b8d6f3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">The test button does not reset service life</text><rect x="68" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="68" y="246" width="10" height="280" rx="5" fill="#8bc5ff"/><text x="106" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">1. Check</text><text x="106" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Manufacture date</text><text x="106" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">and label</text><path d="M390 386 H426" stroke="#8bc5ff" stroke-width="5"/><path d="M426 386 l-14 -11 m14 11 l-14 11" stroke="#8bc5ff" stroke-width="5" fill="none"/><rect x="444" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="444" y="246" width="10" height="280" rx="5" fill="#f5b971"/><text x="482" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">2. Replace</text><text x="482" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">End-of-life, failed</text><text x="482" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">test, or directed</text><path d="M766 386 H802" stroke="#8bc5ff" stroke-width="5"/><path d="M802 386 l-14 -11 m14 11 l-14 11" stroke="#8bc5ff" stroke-width="5" fill="none"/><rect x="820" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="820" y="246" width="10" height="280" rx="5" fill="#85d6b6"/><text x="858" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">3. Verify</text><text x="858" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Test unit and</text><text x="858" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">interconnection</text>
<line x1="48" y1="625" x2="1152" y2="625" stroke="#2e4665" stroke-width="2"/><text x="48" y="655" fill="#a9bdd3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Factual visual • General guidance • Check product instructions and local requirements</text>
</svg>