<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Power source is not sensing type</title><desc id="desc">Comparison diagram explaining that hardwired smoke alarms commonly use backup batteries and may interconnect, while battery alarms may use replaceable or sealed long-life batteries; both require label-based maintenance.</desc>
<rect width="1200" height="675" fill="#0f1520"/><path d="M0 552 C260 480 432 648 720 550 S1030 458 1200 545 L1200 675 L0 675 Z" fill="#12253a"/>
<rect x="48" y="42" width="250" height="36" rx="18" fill="#17324d"/><text x="173" y="67" fill="#8bc5ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">HOME PROTECTION BASICS</text>
<text x="48" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">Power source is not sensing type</text><text x="48" y="166" fill="#b8d6f3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Both still need placement, testing, and replacement</text><path d="M76 212 H1124" stroke="#365575" stroke-width="2"/><rect x="68" y="232" width="344" height="320" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="68" y="232" width="10" height="320" rx="5" fill="#8bc5ff"/><text x="106" y="284" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Hardwired</text><text x="106" y="328" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Household power</text><text x="106" y="362" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">often battery backup</text><text x="106" y="396" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">may interconnect</text><rect x="446" y="232" width="344" height="320" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="446" y="232" width="10" height="320" rx="5" fill="#f5b971"/><text x="484" y="284" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Battery</text><text x="484" y="328" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Replaceable or</text><text x="484" y="362" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">sealed long-life</text><text x="484" y="396" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">battery models</text><rect x="824" y="232" width="344" height="320" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="824" y="232" width="10" height="320" rx="5" fill="#85d6b6"/><text x="862" y="284" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Both</text><text x="862" y="328" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Test monthly</text><text x="862" y="362" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">replace per label</text><text x="862" y="396" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">keep coverage</text>
