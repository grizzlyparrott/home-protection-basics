ans-serif" font-size="21" font-weight="400" text-anchor="start">Entry contacts</text><text x="894" y="384" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">motion paths</text><text x="894" y="418" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">alerts</text><rect x="856" y="425" width="276" height="175" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="856" y="425" width="10" height="175" rx="5" fill="#85d6b6"/><text x="894" y="477" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Response</text><text x="894" y="521" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Backup power</text><text x="894" y="555" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">connectivity</text><text x="894" y="589" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">service terms</text>
