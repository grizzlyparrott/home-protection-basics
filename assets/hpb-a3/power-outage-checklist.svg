e="#85d6b6" stroke-width="3"/><text x="682" y="517" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">reset systems</text><rect x="652" y="527" width="17" height="17" rx="3" fill="none" stroke="#85d6b6" stroke-width="3"/><text x="682" y="544" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">restock supplies</text>
