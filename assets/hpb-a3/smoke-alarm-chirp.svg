<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A safe chirp-check sequence</title><desc id="desc">Troubleshooting flow diagram: if there is smoke, fire, or uncertainty, evacuate and call 911; otherwise use the model manual, check the age and approved battery, and seek qualified help for hardwired or unresolved faults.</desc>
<rect width="1200" height="675" fill="#0f1520"/><path d="M0 552 C260 480 432 648 720 550 S1030 458 1200 545 L1200 675 L0 675 Z" fill="#12253a"/>
<rect x="48" y="42" width="250" height="36" rx="18" fill="#17324d"/><text x="173" y="67" fill="#8bc5ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">HOME PROTECTION BASICS</text>
<text x="48" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">A safe chirp-check sequence</text><text x="48" y="166" fill="#b8d6f3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Treat a full alarm or signs of fire as an emergency</text><rect x="68" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="68" y="246" width="10" height="280" rx="5" fill="#8bc5ff"/><text x="106" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Emergency?</text><text x="106" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Smoke, fire, or</text><text x="106" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">uncertainty: leave</text><text x="106" y="410" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">and call 911</text><path d="M390 386 H426" stroke="#8bc5ff" stroke-width="5"/><path d="M426 386 l-14 -11 m14 11 l-14 11" stroke="#8bc5ff" stroke-width="5" fill="none"/><rect x="444" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="444" y="246" width="10" height="280" rx="5" fill="#f5b971"/><text x="482" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">No sign of fire</text><text x="482" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Find model manual</text><text x="482" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">check age and</text><text x="482" y="410" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">approved battery</text><path d="M766 386 H802" stroke="#8bc5ff" stroke-width="5"/><path d="M802 386 l-14 -11 m14 11 l-14 11" stroke="#8bc5ff" stroke-width="5" fill="none"/><rect x="820" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="820" y="246" width="10" height="280" rx="5" fill="#85d6b6"/><text x="858" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Still unresolved</text><text x="858" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Hardwired or linked</text><text x="858" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">system: qualified</text><text x="858" y="410" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">help or manufacturer</text>
<line x1="48" y1="625" x2="1152" y2="625" stroke="#2e4665" stroke-width="2"/><text x="48" y="655" fill="#a9bdd3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Factual visual • General guidance • Check product instructions and local requirements</text>
