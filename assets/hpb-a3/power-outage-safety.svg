<text x="48" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">Power-outage safety priorities</text><text x="48" y="166" fill="#b8d6f3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Prepare • protect from CO • make temperature-based decisions</text><rect x="68" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="68" y="246" width="10" height="280" rx="5" fill="#8bc5ff"/><text x="106" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Prepare</text><text x="106" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Lighting, charging</text><text x="106" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">thermometers</text><text x="106" y="410" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">medical plan</text><path d="M390 386 H426" stroke="#8bc5ff" stroke-width="5"/><path d="M426 386 l-14 -11 m14 11 l-14 11" stroke="#8bc5ff" stroke-width="5" fill="none"/><rect x="444" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="444" y="246" width="10" height="280" rx="5" fill="#f5b971"/><text x="482" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Prevent CO</text><text x="482" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Generator outdoors</text><text x="482" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">more than 20 feet</text><text x="482" y="410" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">from openings</text><path d="M766 386 H802" stroke="#8bc5ff" stroke-width="5"/><path d="M802 386 l-14 -11 m14 11 l-14 11" stroke="#8bc5ff" stroke-width="5" fill="none"/><rect x="820" y="246" width="312" height="280" rx="22" fill="#162438" stroke="#2e4665" stroke-width="2"/><rect x="820" y="246" width="10" height="280" rx="5" fill="#85d6b6"/><text x="858" y="298" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Protect food</text><text x="858" y="342" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Keep doors closed</text><text x="858" y="376" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">use time and</text><text x="858" y="410" fill="#c8d8ea" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">temperature guidance</text>
