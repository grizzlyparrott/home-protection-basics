<title id="title">Power-outage safety priorities</title><desc id="desc">Three-stage power-outage diagram showing preparation supplies, generator use outdoors more than 20 feet from windows doors and vents with a CO alarm indoors, and food-safety checks based on time and temperature.</desc>
